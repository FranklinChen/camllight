name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep building every OS even when one fails, so a Linux break never
      # hides the macOS result (and vice versa) while we diagnose.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    # `make world` fails unless its toplevel self-test prints fib 20 = 10946.
    - name: Configure, build and test
      run: |
        cd sources/src
        make configure
        make world

    # `make bootstrap` fails unless the recompiled compiler is identical to
    # the committed one.
    - name: Bootstrap
      run: |
        cd sources/src
        make bootstrap
